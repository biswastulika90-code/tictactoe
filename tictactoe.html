<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #1E2761;
    --teal:   #028090;
    --mint:   #02C39A;
    --dark:   #0D1B2A;
    --white:  #FFFFFF;
    --gray:   #94A3B8;
    --light:  #EBF4F6;
    --card-bg:#0D3A4A;
    --red:    #F96167;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--teal) 1px, transparent 1px),
      linear-gradient(90deg, var(--teal) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.04;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    0%   { transform: translateY(0); }
    100% { transform: translateY(60px); }
  }

  /* Glow blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    animation: blobFloat 8s ease-in-out infinite alternate;
  }
  .blob-1 { width: 400px; height: 400px; background: var(--teal);  top: -100px; left: -100px; }
  .blob-2 { width: 300px; height: 300px; background: var(--mint);  bottom: -80px; right: -80px; animation-delay: -4s; }
  .blob-3 { width: 200px; height: 200px; background: var(--navy);  top: 50%; left: 60%; animation-delay: -2s; }

  @keyframes blobFloat {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(30px, 20px) scale(1.1); }
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 20px;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  header {
    text-align: center;
  }

  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 6px;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 0 40px rgba(2,192,154,0.4);
  }

  .logo span { color: var(--mint); }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--gray);
    letter-spacing: 3px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Score board */
  .scoreboard {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .score-card {
    background: rgba(13,58,74,0.7);
    border: 1px solid rgba(2,128,144,0.3);
    border-radius: 12px;
    padding: 12px 24px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: border-color 0.3s, box-shadow 0.3s;
    min-width: 90px;
  }

  .score-card.active-card {
    border-color: var(--mint);
    box-shadow: 0 0 20px rgba(2,195,154,0.25);
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--gray);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .score-mark {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.6rem;
    line-height: 1.2;
  }

  .score-mark.x { color: var(--white); }
  .score-mark.o { color: var(--mint); }

  .score-num {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--white);
  }

  .vs-divider {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--gray);
    letter-spacing: 2px;
  }

  /* Status bar */
  .status-bar {
    background: rgba(13,58,74,0.6);
    border: 1px solid rgba(2,128,144,0.25);
    border-radius: 50px;
    padding: 10px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 1px;
    color: var(--gray);
    backdrop-filter: blur(10px);
    transition: all 0.4s ease;
    text-align: center;
    min-width: 260px;
  }

  .status-bar .highlight { color: var(--mint); font-weight: 500; }
  .status-bar .win-msg   { color: #FFD700; }
  .status-bar .draw-msg  { color: var(--red); }

  /* Board */
  .board-wrapper {
    position: relative;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    position: relative;
  }

  /* Grid lines via pseudo - draw them as lines not gaps */
  .board::before, .board::after,
  .board-h1, .board-h2, .board-v1, .board-v2 {
    content: '';
    position: absolute;
    background: var(--teal);
    border-radius: 3px;
    opacity: 0.7;
    pointer-events: none;
  }

  .board-line {
    position: absolute;
    background: var(--teal);
    border-radius: 3px;
    opacity: 0.7;
    pointer-events: none;
  }

  /* Cell */
  .cell {
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
    border-radius: 4px;
  }

  .cell:hover:not(.taken) {
    background: rgba(2,128,144,0.08);
  }

  .cell:hover:not(.taken)::after {
    content: attr(data-preview);
    font-family: 'Black Han Sans', sans-serif;
    font-size: 3.5rem;
    color: rgba(255,255,255,0.15);
    position: absolute;
  }

  .cell-inner {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 3.5rem;
    line-height: 1;
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s;
    transform: scale(0);
    opacity: 0;
  }

  .cell-inner.show {
    transform: scale(1);
    opacity: 1;
  }

  .cell-inner.x-mark { color: var(--white); text-shadow: 0 0 20px rgba(255,255,255,0.4); }
  .cell-inner.o-mark { color: var(--mint);  text-shadow: 0 0 20px rgba(2,195,154,0.5); }

  .cell.winning .cell-inner {
    animation: winPulse 0.8s ease infinite alternate;
  }

  @keyframes winPulse {
    from { text-shadow: 0 0 10px currentColor; transform: scale(1); }
    to   { text-shadow: 0 0 30px currentColor; transform: scale(1.1); }
  }

  /* Win line overlay */
  .win-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, var(--mint), transparent);
    border-radius: 3px;
    height: 4px;
    opacity: 0;
    transform-origin: left center;
    transition: opacity 0.4s, width 0.4s;
    pointer-events: none;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 28px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .btn-primary {
    background: var(--mint);
    color: var(--dark);
  }

  .btn-primary:hover {
    background: #01a882;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(2,195,154,0.3);
  }

  .btn-secondary {
    background: transparent;
    color: var(--gray);
    border: 1px solid rgba(148,163,184,0.3);
  }

  .btn-secondary:hover {
    border-color: var(--gray);
    color: var(--white);
    transform: translateY(-2px);
  }

  /* Footer credits */
  .credits {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    color: rgba(148,163,184,0.5);
    letter-spacing: 1px;
    text-align: center;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--card-bg);
    border: 1px solid var(--mint);
    border-radius: 50px;
    padding: 10px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--mint);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    opacity: 0;
    pointer-events: none;
    animation: confettiFall 2s ease-in forwards;
    border-radius: 2px;
  }

  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  /* Ripple on click */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(2,195,154,0.25);
    animation: rippleOut 0.5s ease-out forwards;
    pointer-events: none;
  }

  @keyframes rippleOut {
    from { width: 0; height: 0; opacity: 1; top: 50%; left: 50%; }
    to   { width: 120px; height: 120px; opacity: 0; top: calc(50% - 60px); left: calc(50% - 60px); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="toast" id="toast"></div>

<div class="container">

  <header>
    <div class="logo"><span>X</span> TIC-TAC-TOE <span>O</span></div>
    <div class="subtitle">2 · Player · Console · Game</div>
  </header>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-card" id="card-x">
      <div class="score-label">Player 1</div>
      <div class="score-mark x">X</div>
      <div class="score-num" id="score-x">0</div>
    </div>
    <div class="vs-divider">VS</div>
    <div class="score-card" id="card-o">
      <div class="score-label">Player 2</div>
      <div class="score-mark o">O</div>
      <div class="score-num" id="score-o">0</div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status">
    <span class="highlight">Player 1 (X)</span> — Your turn
  </div>

  <!-- Board -->
  <div class="board-wrapper">
    <div class="board" id="board">
      <!-- 9 cells -->
      <div class="cell" data-index="0"><div class="cell-inner"></div></div>
      <div class="cell" data-index="1"><div class="cell-inner"></div></div>
      <div class="cell" data-index="2"><div class="cell-inner"></div></div>
      <div class="cell" data-index="3"><div class="cell-inner"></div></div>
      <div class="cell" data-index="4"><div class="cell-inner"></div></div>
      <div class="cell" data-index="5"><div class="cell-inner"></div></div>
      <div class="cell" data-index="6"><div class="cell-inner"></div></div>
      <div class="cell" data-index="7"><div class="cell-inner"></div></div>
      <div class="cell" data-index="8"><div class="cell-inner"></div></div>

      <!-- Grid lines -->
      <div class="board-line" style="width:4px;height:330px;top:0;left:110px;"></div>
      <div class="board-line" style="width:4px;height:330px;top:0;left:220px;"></div>
      <div class="board-line" style="width:330px;height:4px;top:110px;left:0;"></div>
      <div class="board-line" style="width:330px;height:4px;top:220px;left:0;"></div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="resetGame()">New Game</button>
    <button class="btn btn-secondary" onclick="resetScores()">Reset Scores</button>
  </div>

  <div class="credits">Made by Tulika Biswas &amp; Md. Akib Hossain</div>
</div>

<script>
  // ── State ──────────────────────────────────────────────
  let board = Array(9).fill('');
  let currentPlayer = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0 };

  const WIN_COMBOS = [
    [0,1,2],[3,4,5],[6,7,8],   // rows
    [0,3,6],[1,4,7],[2,5,8],   // cols
    [0,4,8],[2,4,6]            // diagonals
  ];

  // ── DOM refs ──────────────────────────────────────────
  const cells      = document.querySelectorAll('.cell');
  const statusEl   = document.getElementById('status');
  const cardX      = document.getElementById('card-x');
  const cardO      = document.getElementById('card-o');
  const scoreXEl   = document.getElementById('score-x');
  const scoreOEl   = document.getElementById('score-o');
  const toastEl    = document.getElementById('toast');

  // ── Init ──────────────────────────────────────────────
  cells.forEach(cell => {
    const idx = +cell.dataset.index;
    cell.setAttribute('data-preview', 'X');
    cell.addEventListener('click', () => handleClick(idx, cell));
  });

  updateActiveCard();

  // ── Handlers ──────────────────────────────────────────
  function handleClick(idx, cell) {
    if (gameOver || board[idx]) return;

    // Ripple effect
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    cell.appendChild(ripple);
    setTimeout(() => ripple.remove(), 500);

    // Place mark
    board[idx] = currentPlayer;
    const inner = cell.querySelector('.cell-inner');
    inner.textContent = currentPlayer;
    inner.className = `cell-inner show ${currentPlayer === 'X' ? 'x-mark' : 'o-mark'}`;
    cell.classList.add('taken');

    const winner = checkWin();
    if (winner) {
      highlightWin(winner.combo);
      scores[currentPlayer]++;
      updateScores();
      const pNum = currentPlayer === 'X' ? 1 : 2;
      statusEl.innerHTML = `<span class="win-msg">🎉 Player ${pNum} (${currentPlayer}) wins!</span>`;
      showToast(`Player ${pNum} wins! 🏆`);
      launchConfetti();
      gameOver = true;
    } else if (board.every(c => c)) {
      statusEl.innerHTML = `<span class="draw-msg">It's a draw! 🤝</span>`;
      showToast("It's a draw!");
      gameOver = true;
    } else {
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();
      updateActiveCard();
      updatePreviews();
    }
  }

  function checkWin() {
    for (const combo of WIN_COMBOS) {
      const [a, b, c] = combo;
      if (board[a] && board[a] === board[b] && board[a] === board[c])
        return { player: board[a], combo };
    }
    return null;
  }

  function highlightWin(combo) {
    combo.forEach(i => cells[i].classList.add('winning'));
  }

  function updateStatus() {
    const pNum = currentPlayer === 'X' ? 1 : 2;
    const cls  = currentPlayer === 'X' ? 'highlight' : 'highlight';
    statusEl.innerHTML = `<span class="${cls}">Player ${pNum} (${currentPlayer})</span> — Your turn`;
  }

  function updateActiveCard() {
    cardX.classList.toggle('active-card', currentPlayer === 'X');
    cardO.classList.toggle('active-card', currentPlayer === 'O');
  }

  function updatePreviews() {
    cells.forEach(cell => cell.setAttribute('data-preview', currentPlayer));
  }

  function updateScores() {
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
  }

  // ── Reset ──────────────────────────────────────────────
  function resetGame() {
    board = Array(9).fill('');
    currentPlayer = 'X';
    gameOver = false;

    cells.forEach(cell => {
      cell.classList.remove('taken', 'winning');
      const inner = cell.querySelector('.cell-inner');
      inner.className = 'cell-inner';
      inner.textContent = '';
      cell.setAttribute('data-preview', 'X');
    });

    updateStatus();
    updateActiveCard();
  }

  function resetScores() {
    scores = { X: 0, O: 0 };
    updateScores();
    showToast('Scores reset');
    resetGame();
  }

  // ── Toast ──────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  // ── Confetti ───────────────────────────────────────────
  function launchConfetti() {
    const colors = ['#02C39A','#028090','#FFFFFF','#F96167','#FFD700'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random()*100}vw;
        top: -10px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        animation-delay: ${Math.random()*1.2}s;
        animation-duration: ${1.5 + Math.random()}s;
        transform: rotate(${Math.random()*360}deg);
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  }
</script>
</body>
</html>
